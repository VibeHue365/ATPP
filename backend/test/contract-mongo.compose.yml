services:
  contract-mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rsContractTest", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - contract-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  contract-mongo-data:
